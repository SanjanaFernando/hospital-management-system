name: Test Suite

on:
  push:
    branches: [main, dev, 'feature/**']
  pull_request:
    branches: [main, dev]

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - run: npm ci
      - name: Run unit tests
        run: npm run test -- --run lib/ tests/integration/

  security-tests:
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - run: npm ci
      - name: Run security tests (documents known findings — failures expected until fixed)
        run: npm run test -- --run tests/security/

  ai-model-tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: inference-service
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: inference-service/requirements.txt

      - name: Install PyTorch (CPU-only)
        run: pip install torch --index-url https://download.pytorch.org/whl/cpu
    

      - name: Install dependencies
        run: pip install -r requirements.txt pytest httpx

      - name: Run AI/ML model tests
        run: python -m pytest test_api.py -v